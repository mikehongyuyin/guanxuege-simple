# 观学阁（单体版）一键启动编排
#
# 首次构建并启动（含后端单体 + 前端）：
#   docker compose up -d --build
# 之后仅启动（用已构建镜像）：
#   docker compose up -d
# 查看日志：docker compose logs -f app
# 停止并清理：docker compose down
#
# 说明：
#   - 不再使用 Nacos / Gateway / RocketMQ，单体应用直接连接 MySQL，缓存使用 Caffeine 本地缓存
#   - 容器间按服务名互访：mysql / app
#   - 业务服务通过环境变量 MYSQL_HOST 指向 MySQL

services:
  mysql:
    image: mysql:8.0
    container_name: gx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: guanxuege
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 已被本机 MySQL 占用，故将容器映射改为 3307；容器间仍用 3306 通过服务名 mysql 访问
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./backend/sql/:/docker-entrypoint-initdb.d/
      # MySQL 数据持久化：命名卷，删除/重建容器不会丢数据
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================== 后端单体应用 =====================
  app:
    build: ./backend
    image: gx-app
    container_name: gx-app
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      # JWT 签名密钥。本地可留空走内置默认值；部署到服务器前务必替换为随机长串（>=32 字符）
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      # 上传的图片持久化：容器内 /app/images <-> 宿主机 backend/images
      - ./backend/images:/app/images
    depends_on:
      mysql:
        condition: service_healthy

  # ===================== 前端 =====================
  frontend:
    build: ./frontend
    image: gx-frontend
    container_name: gx-frontend
    ports:
      - "8088:80"
    depends_on:
      - app

volumes:
  mysql-data:
