server:
  port: 8080

spring:
  application:
    name: guanxuege-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    gateway:
      # 全局跨域（开发期放开，生产按需收紧）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: auth
          uri: lb://guanxuege-auth
          predicates:
            - Path=/api/auth/**
        - id: child
          uri: lb://guanxuege-auth
          predicates:
            - Path=/api/child/**
        - id: learning-plan
          uri: lb://guanxuege-learning-plan
          predicates:
            - Path=/api/plan/**
        - id: grade
          uri: lb://guanxuege-grade
          predicates:
            - Path=/api/grade/**
        - id: community-post
          uri: lb://guanxuege-community
          predicates:
            - Path=/api/post/**
        - id: community-comment
          uri: lb://guanxuege-community
          predicates:
            - Path=/api/comment/**
        - id: community-topic
          uri: lb://guanxuege-community
          predicates:
            - Path=/api/topic/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
