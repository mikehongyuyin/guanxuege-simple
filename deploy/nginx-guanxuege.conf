# 观学阁 Nginx 反代配置模板（云服务器，ICP 备案通过后使用）
# 放置：/etc/nginx/conf.d/guanxuege.conf
# 证书：阿里云免费 SSL 证书（Nginx 版），放到 /etc/nginx/ssl/ 目录
# 使用前把 server_name 里的域名替换为你的真实域名

# HTTPS 站点
server {
    listen 443 ssl http2;
    server_name guanxuege.cn www.guanxuege.cn;

    ssl_certificate     /etc/nginx/ssl/guanxuege.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/guanxuege.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端页面 + /api 均由前端容器 Nginx 处理（同域，无跨域问题）
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # 图片等静态资源缓存
    location /api/images/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name guanxuege.cn www.guanxuege.cn;
    return 301 https://$host$request_uri;
}
