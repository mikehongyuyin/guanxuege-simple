# GuanXueGe CI

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        working-directory: ./backend
        run: mvn -B verify -DskipITs
        env:
          JWT_SECRET: ci-test-secret-please-ignore-32chars-min

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  security-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for private keys and secrets
        run: |
          echo "Checking for private keys / credentials in the repository..."
          FOUND=0
          if git ls-files | grep -iE '\.(key|pem|p8|p12|pfx)$'; then
            echo "::error::Found private key files tracked in git!"
            FOUND=1
          fi
          if git ls-files | grep -iE '(^|/)\.env$'; then
            echo "::error::Found .env tracked in git!"
            FOUND=1
          fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY' -- . ; then
            echo "::error::Found private key content in tracked files!"
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No secrets detected."
